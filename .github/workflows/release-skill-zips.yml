name: Release skill zips

# claude.ai's manual "Upload skill" flow does not accept a GitHub repo — it
# takes one zip per skill, with SKILL.md at the zip root. This workflow
# builds those zips with scripts/build-skill-zips.sh and attaches them to
# a GitHub Release so the README can link to stable download URLs
# (.../releases/latest/download/<skill-name>.zip).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach zips to (defaults to the latest tag)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve target tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="$(git describe --tags --abbrev=0)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build skill zips
        run: ./scripts/build-skill-zips.sh dist

      - name: Attach zips to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: dist/*.zip
          fail_on_unmatched_files: true
